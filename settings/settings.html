<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self' genesis-sound:; connect-src 'self'">
    <title>Genesis Client - Settings</title>
    <link rel="stylesheet" href="settings.css">
</head>
<body>
    <div class="settings-container">
        <!-- Sidebar (populated from the section registry) -->
        <div class="sidebar">
            <div class="sidebar-header">Settings</div>
            <div class="sidebar-section" id="sidebarSections"></div>
        </div>

        <!-- Content -->
        <div class="content">
            <div class="content-header">
                <div>
                    <div class="content-title">Settings</div>
                </div>
                <div class="content-actions">
                    <input type="text" class="search-box" placeholder="Search settings..." id="searchBox">
                    <button class="btn secondary" id="cancelBtn">Cancel</button>
                    <button class="btn secondary" id="resetAllBtn">Reset All</button>
                    <button class="btn" id="saveBtn">Save</button>
                </div>
            </div>

            <div class="content-body" id="contentBody">
                <!-- Error/Success Messages -->
                <div class="error-message" id="errorMessage"></div>
                <div class="success-message" id="successMessage"></div>

                <!-- Settings sections are appended here by settings-renderer.js -->
            </div>
        </div>
    </div>

    <!-- Reset Confirmation Modal -->
    <div class="modal" id="resetModal">
        <div class="modal-content">
            <div class="modal-header">Reset Settings</div>
            <div class="modal-body">
                <p>Are you sure you want to reset all settings to their default values? This action cannot be undone.</p>
            </div>
            <div class="modal-footer">
                <button class="btn secondary" id="cancelResetBtn">Cancel</button>
                <button class="btn danger" id="confirmResetBtn">Reset All</button>
            </div>
        </div>
    </div>

    <!-- Section registry and definitions (order controls the sidebar order) -->
    <script src="sections/registry.js"></script>
    <script src="sections/ui.js"></script>
    <script src="sections/buttons.js"></script>
    <script src="sections/hotkeys.js"></script>
    <script src="sections/sounds.js"></script>
    <script src="sections/window.js"></script>
    <script src="sections/json.js"></script>
    <script src="settings-renderer.js"></script>
</body>
</html>
