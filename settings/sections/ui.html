<div class="setting-group">
    <div class="setting-group-title">User Interface</div>

    <div class="setting-item">
        <label class="setting-label">Show Button Panel</label>
        <div class="setting-description">Display the custom button panel on the left side of the game window</div>
        <input type="checkbox" class="setting-input setting-checkbox" data-path="ui.showButtonPanel">
    </div>

    <div class="setting-item">
        <label class="setting-label">Button Panel Width</label>
        <div class="setting-description">Width of the button panel in pixels (30-100)</div>
        <input type="number" class="setting-input" data-path="ui.buttonPanelWidth" min="30" max="100">
    </div>

    <div class="setting-item">
        <label class="setting-label">Hide Menu Bar</label>
        <div class="setting-description">Hide the menu bar (press Alt to show it temporarily)</div>
        <input type="checkbox" class="setting-input setting-checkbox" data-path="ui.hideMenuBar">
    </div>
</div>
